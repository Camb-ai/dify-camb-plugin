provider: camb
label:
  en_US: "CAMB AI"
description:
  en_US: "CAMB AI provides multilingual TTS, translation, and transcription"
icon_small:
  en_US: "icon.png"
icon_large:
  en_US: "icon.png"
supported_model_types:
  - tts
  - speech2text
configurate_methods:
  - predefined-model
extra:
  python:
    provider_source: "provider/camb.py"
    model_sources:
      - "models/tts/tts.py"
      - "models/speech2text/speech2text.py"
provider_credential_schema:
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: "API Key"
      type: secret-input
      required: true
      placeholder:
        en_US: "Enter your CAMB AI API key"
